<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <defs>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="3" cy="3" r="2" fill="#18181b" opacity="0.09" />
    </pattern>
    <clipPath id="card-clip">
      <rect x="64" y="58" width="1040" height="500" rx="38" />
    </clipPath>
  </defs>

  <rect width="1200" height="630" fill="#f4f2ee" />
  <rect width="1200" height="630" fill="url(#dots)" opacity="0.45" />

  <!-- Background accents -->
  <path d="M48 89l13-27 14 27 29 4-21 21 5 29-27-14-26 14 5-29-21-21Z" fill="#fbbf24" stroke="#18181b" stroke-width="5" />
  <circle cx="1130" cy="92" r="26" fill="#fb7185" stroke="#18181b" stroke-width="5" />
  <path d="M1112 525l47 23-42 30" fill="none" stroke="#38bdf8" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Main card -->
  <rect x="84" y="78" width="1040" height="500" rx="38" fill="#18181b" />
  <rect x="64" y="58" width="1040" height="500" rx="38" fill="#6ee7b7" stroke="#18181b" stroke-width="7" />
